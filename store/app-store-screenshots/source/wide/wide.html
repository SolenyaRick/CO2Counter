<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Karla:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#EFE9DC;--surface:#FFFCF5;--ink:#2E2A22;--ink2:#4A453A;--moss:#3F5B3A;--canopy:#17241a;--sprout:#c4e57d;--honey:#D9A441;--on:#F1EDE4;--onm:#B7C2AE}
*{box-sizing:border-box}body{margin:0;background:#555}
.slide{position:relative;overflow:hidden;font-family:Karla,sans-serif;margin:0 0 40px}
.ipad{width:2064px;height:2752px}.laptop{width:2880px;height:1800px}
.dark{background:var(--canopy);color:var(--on)}.light{background:var(--cream);color:var(--ink)}.honey{background:var(--honey);color:#2a1f08}.sage{background:#DCE3CC;color:var(--ink)}
.glow{position:absolute;border-radius:50%;pointer-events:none;width:2200px;height:2200px}
.glow.a{left:-800px;top:-900px}.glow.b{right:-900px;bottom:-1100px}
.dark .glow.a{background:radial-gradient(closest-side,rgba(196,229,125,.2),transparent)}.dark .glow.b{background:radial-gradient(closest-side,rgba(217,164,65,.15),transparent)}
.light .glow.a,.sage .glow.a{background:radial-gradient(closest-side,rgba(163,181,143,.55),transparent)}.light .glow.b,.sage .glow.b{background:radial-gradient(closest-side,rgba(232,200,138,.6),transparent)}
.honey .glow.a{background:radial-gradient(closest-side,rgba(255,240,200,.5),transparent)}.honey .glow.b{background:radial-gradient(closest-side,rgba(184,101,61,.3),transparent)}
.bars{position:absolute;display:flex;align-items:flex-end;gap:16px;height:84px}
.bars i{display:block;width:20px;border-radius:10px}
.bars i:nth-child(1){height:84px}.bars i:nth-child(2){height:62px}.bars i:nth-child(3){height:40px}.bars i:nth-child(4){height:18px}
.dark .bars i{background:var(--sprout);opacity:.9}.dark .bars i:last-child{background:var(--honey)}
.light .bars i,.sage .bars i{background:var(--moss);opacity:.85}.light .bars i:last-child,.sage .bars i:last-child{background:var(--honey);opacity:1}
.honey .bars i{background:#2a1f08;opacity:.85}.honey .bars i:last-child{background:var(--surface);opacity:1}
.brand{display:flex;align-items:center;gap:22px;font:800 52px/1 'Bricolage Grotesque';letter-spacing:-.02em}
.brand img{width:86px;height:86px;border-radius:22px}
.eyebrow{display:inline-block;font:700 36px/1 Karla;letter-spacing:.14em;text-transform:uppercase;padding:16px 26px;border-radius:999px}
.dark .eyebrow{background:rgba(196,229,125,.14);color:var(--sprout)}.light .eyebrow,.sage .eyebrow{background:rgba(63,91,58,.12);color:var(--moss)}.honey .eyebrow{background:rgba(42,31,8,.12);color:#2a1f08}
.eyebrow.beta{background:var(--honey);color:#2a1f08}
h1{margin:44px 0 0;font:800 160px/.93 'Bricolage Grotesque';letter-spacing:-.045em}
.dark h1 em{font-style:normal;color:var(--sprout)}.light h1 em,.sage h1 em{font-style:normal;color:var(--moss)}.honey h1 em{font-style:normal;color:var(--surface)}
p.sub{margin:40px 0 0;font:500 54px/1.32 Karla}
.dark p.sub{color:var(--onm)}.light p.sub,.sage p.sub{color:var(--ink2)}.honey p.sub{color:#3d2e0e}
/* iPad: words on top, device below, bleeding off the bottom */
.ipad .words{position:absolute;left:150px;right:150px;top:170px}
.ipad .bars{right:150px;top:180px}
.ipad h1{max-width:1600px}.ipad p.sub{max-width:1500px}
.ipad .dev{position:absolute;left:50%;top:1000px;width:1700px;margin-left:-850px;border-radius:110px;padding:42px;background:#0d0f0c;box-shadow:0 0 0 5px #3a3f36 inset,0 90px 180px -50px rgba(0,0,0,.55)}
.light.ipad .dev,.sage.ipad .dev{box-shadow:0 0 0 5px #3a3f36 inset,0 90px 180px -60px rgba(46,42,34,.5)}
.ipad .scr{border-radius:72px;overflow:hidden;background:#fff}
.ipad .scr img{display:block;width:100%}
/* Laptop: words on the left, a browser window on the right */
.laptop .words{position:absolute;left:130px;top:0;bottom:0;width:900px;display:flex;flex-direction:column;justify-content:center}
.laptop h1{font-size:128px}.laptop p.sub{font-size:48px}
.laptop .bars{left:130px;top:150px}
.laptop .dev{position:absolute;left:1110px;top:50%;width:1660px;transform:translateY(-50%);border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.18),0 80px 160px -40px rgba(0,0,0,.55),0 30px 60px -30px rgba(0,0,0,.35)}
.light.laptop .dev,.sage.laptop .dev{box-shadow:0 0 0 2px rgba(46,42,34,.12),0 80px 160px -50px rgba(46,42,34,.45)}
.chrome{height:84px;display:flex;align-items:center;gap:16px;padding:0 30px;background:#E9E5DC;border-bottom:1px solid #D6D0C2}
.chrome i{width:22px;height:22px;border-radius:50%;background:#E0675A}.chrome i:nth-child(2){background:#E9B44C}.chrome i:nth-child(3){background:#69B865}
.url{margin-left:40px;flex:1;max-width:900px;height:48px;border-radius:14px;background:#FBF8F1;display:flex;align-items:center;gap:12px;padding:0 22px;font:600 26px Karla;color:#6B6455}
.url svg{width:24px;height:24px}
.laptop .scr img{display:block;width:100%}
.chip{position:absolute;z-index:5;display:flex;align-items:center;gap:24px;padding:36px 48px;border-radius:48px;font:800 62px/1 'Bricolage Grotesque';letter-spacing:-.02em;box-shadow:0 40px 80px -30px rgba(0,0,0,.45)}
.chip small{display:block;font:700 30px/1.2 Karla;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-bottom:10px}
.chip .dot{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;flex:none}
.chip svg{width:48px;height:48px}
.chip.sprout{background:var(--sprout);color:var(--canopy)}.chip.sprout .dot{background:var(--canopy);color:var(--sprout)}
.chip.cream{background:var(--surface);color:var(--ink)}.chip.cream .dot{background:var(--moss);color:var(--surface)}
.chip.honeyc{background:var(--honey);color:#2a1f08}.chip.honeyc .dot{background:#2a1f08;color:var(--honey)}
.chip.canopyc{background:var(--canopy);color:var(--on)}.chip.canopyc .dot{background:var(--sprout);color:var(--canopy)}
</style></head><body><div id="out"></div>
<script>
const I={leaf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14Z"/><path d="M5 19l7-7"/></svg>',
down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg>',
clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'};
const MODE=new URLSearchParams(location.search).get('m')||'ipad';
const S=[
 {bg:'dark',brand:true,h:'Know your footprint.<br><em>Watch it shrink.</em>',sub:'A free UK carbon footprint calculator, built around the changes that matter most.',img:'welcome',path:'co2counter.co.uk',chip:{cls:'sprout',icon:'leaf',small:'Free for everyone',text:'No ads, ever'}},
 {bg:'light',eye:'Six short steps',h:'Answer a few questions about <em>your week.</em>',sub:'Meals, travel, flights, home, pets and money. About five minutes.',img:'survey',path:'co2counter.co.uk',chip:{cls:'cream',icon:'clock',small:'No account needed',text:'About 5 minutes'}},
 {bg:'sage',eye:'Your results',h:'See where it <em>really</em> comes from.',sub:'Your yearly footprint against the UK average and the 1.5°C budget.',img:'results',path:'co2counter.co.uk/#/results',chip:{cls:'canopyc',icon:'down',small:'With realistic changes',text:'−2,018 kg a year'}},
 {bg:'dark',eye:'Picture your year',h:'Watch your footprint <em>shrink.</em>',sub:'Step through your biggest changes and see the difference each one makes.',img:'story',path:'co2counter.co.uk/#/results',chip:{cls:'sprout',icon:'down',small:'Tap through',text:'Your 3 biggest moves'}},
 {bg:'honey',eye:'Greener switches',h:'Find your <em>biggest</em> switch.',sub:'Real Zero’s 7 Acts, with switches picked for the climate first.',img:'switches',path:'co2counter.co.uk/greener-switches',chip:{cls:'canopyc',icon:'leaf',small:'Move your money',text:'−87% less CO₂e'}},
 {bg:'light',eye:'My Habits',h:'Build habits that <em>stick.</em>',sub:'Bank each Act, level up, and see what’s left to save.',img:'habits',path:'co2counter.co.uk/#/habits',chip:{cls:'honeyc',icon:'leaf',small:'Level 2',text:'Sprout'}},
 {bg:'dark',eye:'Beta · a rough guess',eyeCls:'beta',h:'What if everyone lived <em>like you?</em>',sub:'A simplified picture of how fast the world would warm. An illustration, not a forecast.',img:'warm',path:'co2counter.co.uk/#/results',chip:null},
];
// Badge positions per layout, so they never cover the key numbers.
const POS={ipad:['right:70px;top:1500px','left:70px;top:1180px','right:70px;top:1180px','left:70px;top:1450px','right:70px;top:1180px','left:70px;top:1180px',''],
 laptop:['right:60px;bottom:90px','right:60px;bottom:90px','right:60px;bottom:80px','right:60px;bottom:90px','right:60px;bottom:90px','right:60px;bottom:90px','']};
const out=document.getElementById('out');
S.forEach((s,i)=>{
 const words=`<div class="words">${s.brand?'<div class="brand"><img src="leaf-ledger.svg">CO2 Counter</div>':`<span class="eyebrow ${s.eyeCls||''}" style="align-self:flex-start">${s.eye}</span>`}<h1>${s.h}</h1><p class="sub">${s.sub}</p></div>`;
 const dev=MODE==='ipad'?`<div class="dev"><div class="scr"><img src="raw-ipad/${s.img}.png"></div></div>`
  :`<div class="dev"><div class="chrome"><i></i><i></i><i></i><span class="url">${I.lock}${s.path}</span></div><div class="scr"><img src="raw-laptop/${s.img}.png"></div></div>`;
 const chip=s.chip?`<div class="chip ${s.chip.cls}" style="${POS[MODE][i]}"><span class="dot">${I[s.chip.icon]}</span><span><small>${s.chip.small}</small>${s.chip.text}</span></div>`:'';
 out.insertAdjacentHTML('beforeend',`<section class="slide ${MODE} ${s.bg}" id="s${i}"><i class="glow a"></i><i class="glow b"></i>${MODE==='ipad'||!s.brand?'<div class="bars"><i></i><i></i><i></i><i></i></div>':''}${words}${dev}${chip}</section>`);
});
</script></body></html>
